name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: >
          Welcome @${{ github.actor }}! Thanks for opening your first issue. 
          Please check out our [Contributing Guide](https://github.com/your-username/your-repo/blob/main/CONTRIBUTING.md) 
          and our [Code of Conduct](https://github.com/your-username/your-repo/blob/main/CODE_OF_CONDUCT.md).
        pr-message: >
          Welcome @${{ github.actor }}! Thanks for your first pull request. 
          Be sure to review our [Contribution Guidelines](https://github.com/your-username/your-repo/blob/main/CONTRIBUTING.md).
